name: AWS Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.3.0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_MAIN_HOST_IP }}
          username: mini-rag-github
          key: ${{ secrets.SSH_MAIN_PRIVATE_KEY }}
          script: |
            cd /home/mini-rag-github/workspace/mini-RAG
            git pull origin main
            sudo systemctl daemon-reload
            sudo systemctl restart minirag.service
            echo "Waiting for 60 seconds to allow services to start..."
            sleep 60

            for i in {1..6}; do
                if ss -tuln | grep -q ':80'; then
                  echo "✅ Port 80 is now active."
                  break
                else
                  echo "⏳ Port 80 not ready yet. Retrying in 5 seconds..."
                  sleep 5
                fi
              done

              if ! ss -tuln | grep -q ':80'; then
                echo "❌ Service failed to start on port 80"
                exit 1
              fi
